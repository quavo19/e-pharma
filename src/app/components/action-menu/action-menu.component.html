<div class="relative action-menu-container">
  <button
    (click)="toggleMenu($event)"
    class="p-2 rounded-lg hover:bg-gray-100 cursor-pointer"
  >
    <lucide-icon [img]="icons.MoreVertical" [size]="18" />
  </button>
  @if (isOpen()) {
  <div
    [attr.data-menu-id]="menuId"
    [class]="
      'fixed origin-top-right p-2 rounded-b-2xl rounded-tl-2xl min-w-32 bg-gray-50 shadow-lg z-50 divide-y divide-gray-200 flex flex-col gap-2'
    "
    [style.top]="dropdownPosition()?.top || 'auto'"
    [style.right]="dropdownPosition()?.right || 'auto'"
    [style.transform]="isMenuAbove() ? 'translateY(-100%)' : undefined"
    (click)="$event.stopPropagation()"
  >
    @for (item of items(); track item.label) {
    <button
      [disabled]="item.disabled"
      [class]="
        item.disabled
          ? 'w-full flex items-center gap-2 px-4 py-2 text-sm text-gray-400 cursor-not-allowed opacity-50 text-left'
          : item.variant === 'danger'
          ? 'w-full flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 cursor-pointer text-left'
          : 'w-full flex items-center gap-2 px-4 py-2 text-sm hover:bg-green-50 cursor-pointer text-left'
      "
      (click)="onItemClick(item, $event)"
    >
      @if (item.icon) {
      <lucide-icon [img]="item.icon" [size]="16" />
      }
      {{ item.label }}
    </button>
    }
  </div>
  }
</div>
