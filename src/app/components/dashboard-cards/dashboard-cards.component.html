<app-dashboard-heading title="Overview" desc="Overview of your account and recent activities" />
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
  <app-dashboard-card title="Total Sales (GH₵)" count="1,234" value="₵45,678" [icon]="icons.ShoppingCart"
    (onSeeMore)="onSeeMore('Total Sales (GH₵)')" />

  <app-dashboard-card title="Total Customers" count="856" value="" [icon]="icons.Users"
    (onSeeMore)="onSeeMore('Total Customers')" />

  <app-dashboard-card title="Low Stock" count="12" value="₵2,345" [icon]="icons.AlertTriangle"
    (onSeeMore)="onSeeMore('Low Stock')" />

  <app-dashboard-card title="Out of Stock" count="5" value="₵1,234" [icon]="icons.XCircle"
    (onSeeMore)="onSeeMore('Out of Stock')" />

  <app-dashboard-card title="Nearing Expiry" count="23" value="₵3,456" [icon]="icons.Hourglass"
    (onSeeMore)="onSeeMore('Nearing Expiry')" />

  <app-dashboard-card title="Expired Products" count="10" value="₵5,678" [icon]="icons.Ban"
    (onSeeMore)="onSeeMore('Expired Products')" />
</div>

<app-popup [isOpen]="isModalOpen()" [heading]="selectedCardTitle()"
  [description]="'Detailed view of ' + selectedCardTitle().toLowerCase()" (close)="onCloseModal()">
  <div class="overflow-auto max-h-96">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50 sticky top-0 z-10">
        <tr>
          @for (header of getTableHeaders(); track header) {
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            {{ header }}
          </th>
          }
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        @for (row of selectedCardData(); track $index) {
        <tr class="hover:bg-gray-50">
          @for (value of getTableRowValues(row); track $index) {
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            {{ value }}
          </td>
          }
        </tr>
        }
      </tbody>
    </table>
  </div>
</app-popup>
