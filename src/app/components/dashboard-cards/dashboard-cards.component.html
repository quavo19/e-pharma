<app-dashboard-heading
  title="Overview"
  desc="Overview of your account and recent activities"
/>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
  <app-dashboard-card
    title="Total Sales (GH₵)"
    count="1,234"
    value="₵45,678"
    [icon]="icons.ShoppingCart"
    (onSeeMore)="onSeeMore('Total Sales (GH₵)')"
  />

  <app-dashboard-card
    title="Low Stock"
    count="₵2,345"
    value="12"
    [icon]="icons.AlertTriangle"
    (onSeeMore)="onSeeMore('Low Stock')"
  />

  <app-dashboard-card
    title="Out of Stock"
    count="₵1,234"
    value="5"
    [icon]="icons.XCircle"
    (onSeeMore)="onSeeMore('Out of Stock')"
  />

  <app-dashboard-card
    title="Nearing Expiry"
    count="₵3,456"
    value="10"
    [icon]="icons.Hourglass"
    (onSeeMore)="onSeeMore('Nearing Expiry')"
  />

  <app-dashboard-card
    title="Expired Products"
    count="₵5,678"
    value=" 10"
    [icon]="icons.Ban"
    (onSeeMore)="onSeeMore('Expired Products')"
  />
</div>

<app-popup
  [isOpen]="isModalOpen()"
  [heading]="selectedCardTitle()"
  [description]="'Detailed view of ' + selectedCardTitle().toLowerCase()"
  [variant]="'center'"
  (close)="onCloseModal()"
>
  @if (selectedCardData().length === 0) {
  <div class="p-6 text-sm text-gray-500">No data available</div>
  } @else {
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50 sticky top-0 z-10">
      <tr>
        @for (header of getTableHeaders(); track header) {
        <th
          class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
        >
          {{ header }}
        </th>
        }
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      @for (row of selectedCardData(); track $index) {
      <tr class="hover:bg-gray-50">
        @for (value of getTableRowValues(row); track $index) {
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
          {{ value }}
        </td>
        }
      </tr>
      }
    </tbody>
  </table>
  }
</app-popup>
