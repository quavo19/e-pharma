<div class="flex items-center">
  <p class="font-semibold text-gray-800">{{ title() }}</p>
  <div class="relative">
    <button (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()"
      class="p-1 text-gray-400 hover:text-gray-600 transition-colors duration-200">
      <lucide-icon [img]="icons.Info" [size]="16" />
    </button>
    <div [class]="
        'absolute top-full left-1/2 transform -translate-x-1/2  bg-gray-900 text-white text-xs rounded-lg px-3 py-2 z-9999 transition-all duration-200 w-48 ' +
        (showTooltip()
          ? 'opacity-100 scale-100 translate-y-0'
          : 'opacity-0 scale-95 -translate-y-2 pointer-events-none')
      " style="transition-delay: 500ms">
      {{ desc() }}
      <div class="absolute -top-1 left-1/2 transform -translate-x-1/2 w-2 h-2 bg-gray-900 rotate-45"></div>
    </div>
  </div>
</div>
