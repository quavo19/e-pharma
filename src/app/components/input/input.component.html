<div
  [ngClass]="[className()]"
  class="flex flex-col justify-start text-primary text-base items-start gap-1"
>
  <label [for]="id()" class="block" [class]="isDisabled() ? 'opacity-50' : ''">
    {{ label() }}
    @if (required()) {
    <span class="text-red-700">*</span>
    }
  </label>

  <div class="relative w-full">
    @if (hasLeftIcon()) {
    <div class="absolute left-4 top-1/2 -translate-y-1/2 z-10">
      <ng-content select="[slot=left-icon]"></ng-content>
    </div>
    } @if (hasRightIcon()) {
    <div class="absolute right-4 top-1/2 -translate-y-1/2 z-10">
      <ng-content select="[slot=right-icon]"></ng-content>
    </div>
    }

    <input
      [id]="id()"
      [type]="type()"
      [placeholder]="placeholder()"
      [formControl]="control()"
      [class.pl-10]="hasLeftIcon()"
      [class.pr-10]="hasRightIcon()"
      [class.rounded-r-none]="isForChatBox()"
      (blur)="inputBlur.emit($event)"
      (keydown)="handleyKeyEvent($event)"
      [class]="combinedClasses()"
    />
  </div>

  @if (!!errorMessage()) {
  <span class="text-xs mt-1 text-red-700 text-left">{{ errorMessage() }}</span>
  }
</div>
