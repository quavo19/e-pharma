<div class="bg-white rounded-xl p-4">
  <div class="mb-11">
    <app-dashboard-heading
      title="Sales Analytics"
      desc="Revenue breakdown by month"
    />
  </div>

  <div class="relative">
    <div
      class="absolute left-0 top-0 h-full flex flex-col justify-between text-xs text-gray-500 pr-2"
    >
      @for (label of getYAxisLabels(); track label) {
      <span>{{ label }}</span>
      }
    </div>

    <div class="ml-8 flex items-end justify-between h-64 gap-1">
      @for (data of monthlyData(); track data.month; let i = $index) {
      <div class="flex flex-col items-center flex-1 relative group">
        <div
          class="relative w-full h-64 flex flex-col bg-gray-100 rounded-xl justify-end"
        >
          <div
            class="w-full"
            [style.height.%]="getRemainingHeight(data.value)"
          ></div>
          <div
            class="w-full rounded-xl relative cursor-pointer transition-all duration-200"
            [class]="
              isHovered(data.month)
                ? isOddBar(i)
                  ? 'bg-[#8FEC61]'
                  : 'bg-green-800'
                : isOddBar(i)
                ? 'bg-[#8FEC61]'
                : 'bg-green-800'
            "
            [style.height.%]="getBarHeight(data.value)"
            [style.min-height.px]="8"
            (mouseenter)="onMouseEnter(data.month)"
            (mouseleave)="onMouseLeave()"
          >
            @if (isHovered(data.month)) {
            <div
              class="absolute inset-0 opacity-80 rounded-xl"
              [class]="isOddBar(i) ? 'bg-[#6fb64c]' : 'bg-[#20460d]'"
              style="
                background-image: repeating-linear-gradient(
                  45deg,
                  transparent,
                  transparent 2px,
                  rgba(255, 255, 255, 0.1) 2px,
                  rgba(255, 255, 255, 0.1) 4px
                );
              "
            ></div>
            }
          </div>
        </div>

        <div class="mt-2 text-xs text-gray-600 font-medium">
          {{ data.month }}
        </div>

        @if (isHovered(data.month)) {
        <div class="absolute top-16 left-1/2 transform -translate-x-1/2 z-10">
          <div
            class="bg-green-100 text-green-800 px-3 py-2 rounded-lg text-sm font-medium shadow-lg relative"
          >
            {{ data.displayValue }}
            <div
              class="absolute top-full left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-4 border-r-4 border-t-4 border-l-transparent border-r-transparent border-t-green-100"
            ></div>
          </div>
        </div>
        }
      </div>
      }
    </div>
  </div>
</div>
