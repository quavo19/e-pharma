@if (isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 min-h-0">
  <div class="absolute inset-0 bg-black/50" (click)="onClose()"></div>
  <div
    class="relative bg-white rounded-xl shadow-xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-scroll"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between p-6 shrink-0">
      <div class="font-light">
        @if (heading()) {
        <p class="text-base font-semibold text-gray-900">{{ heading() }}</p>
        } @if (description()) {
        <p class="mt-1 text-sm text-gray-600">{{ description() }}</p>
        }
      </div>
      <button
        (click)="onClose()"
        class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors duration-200"
      >
        <lucide-icon [img]="icons.X" [size]="20" />
      </button>
    </div>
    <div class="px-6 py-4 flex-1 overflow-y-auto min-h-0">
      <ng-content></ng-content>
    </div>
    @if (primaryAction() || secondaryAction()) {
    <div class="flex gap-3 p-6 shrink-0 border-t border-gray-200">
      @if (secondaryAction()) {
      <button
        (click)="onSecondaryAction()"
        [class]="getSecondaryButtonClasses()"
      >
        {{ secondaryAction()?.label }}
      </button>
      } @if (primaryAction()) {
      <button (click)="onPrimaryAction()" [class]="getPrimaryButtonClasses()">
        {{ primaryAction()?.label }}
      </button>
      }
    </div>
    }
  </div>
</div>
}
