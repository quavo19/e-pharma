<div class="relative inline-block">
  <button
    class="flex items-center w-4 h-4 justify-center text-xs bg-white rounded-sm"
    (click)="toggleDropdown()"
    type="button"
    aria-haspopup="true"
    [attr.aria-expanded]="isOpen()"
  >
    <div
      class="w-4 h-4 transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    >
      <lucide-icon
        strokeWidth="2px"
        [img]="icons.ChevronDown"
        class="w-full h-4 text-gray-700"
      ></lucide-icon>
    </div>
  </button>
  @if (isOpen()) {
  <div
    [class]="
      'fixed origin-top-right font-light bg-gray-50 border-gray-200 rounded-xl shadow-lg z-50 mt-2 ' +
      dropdownWidth()
    "
    [style.top]="dropdownPosition()?.top || 'auto'"
    [style.right]="dropdownPosition() ? 'auto' : undefined"
    [style.left]="dropdownPosition()?.left || 'auto'"
    [style.transform]="dropdownPosition() ? 'translateX(-100%)' : undefined"
    role="menu"
    aria-orientation="vertical"
    tabindex="-1"
    (click)="$event.stopPropagation()"
  >
    @if (enableSearch()) {
    <div class="p-2 border-b border-gray-100">
      <input
        type="text"
        class="w-full px-3 py-2 text-sm font-light border border-gray-300 rounded-lg focus:outline-none text-black"
        [placeholder]="placeholder()"
        [formControl]="searchControl"
        (input)="onSearchChange()"
      />
    </div>
    }
    <div class="max-h-60 overflow-y-auto my-2 flex flex-col gap-1">
      @for (option of filteredOptions(); track option.id; let isLast = $last) {
      <div class="px-2 flex flex-col gap-1">
        <button
          (click)="selectItem(option)"
          [class]="
            'w-full px-4 py-3 text-left text-sm hover:bg-green-50 rounded-xl transition-colors duration-200 flex items-center gap-3 ' +
            (option.id == currentParamValue()
              ? 'bg-green-100 text-green-800 font-medium'
              : 'text-gray-700')
          "
        >
          <span>{{ option.label }}</span>
          @if (option.id == currentParamValue()) {
          <div class="ml-auto w-2 h-2 bg-green-600 rounded-full"></div>
          }
        </button>
        @if (!isLast) {
        <div class="px-4">
          <span class="w-full h-px bg-gray-200 block"></span>
        </div>
        }
      </div>
      }
      <div class="px-2 flex flex-col gap-1">
        <button
          (click)="selectItem(null)"
          class="w-full px-4 py-3 text-left text-sm hover:bg-green-50 rounded-xl transition-colors duration-200 flex items-center gap-3 text-gray-700"
        >
          <span>{{ clearLabel() }}</span>
        </button>
      </div>
      @if (filteredOptions().length === 0) {
      <div class="px-4 py-3 text-sm text-gray-500 text-center">
        No options available
      </div>
      }
    </div>
  </div>
  }
</div>
