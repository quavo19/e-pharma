<main class="p-6 relative">
  <section class="flex flex-col gap-2">
    <!-- Add Branch Modal -->
    <app-popup [isOpen]="isAddOpen" [heading]="'Add Branch'" [description]="'Create a new branch'" [variant]="'right'"
      [panelWidth]="'w-[44rem]'" [primaryAction]="addBranchPrimaryAction" [secondaryAction]="addBranchSecondaryAction"
      (close)="closeAdd()">
      <form [formGroup]="addBranchForm" (ngSubmit)="onSubmitAddBranch()" class="flex flex-col gap-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-input [label]="'Branch Name'" [placeholder]="'Main Facility'" [control]="addBranchForm.controls.name"
            [id]="'branch-name'" [required]="true" variant="select" />
          <div>
            <app-select [options]="regionOptions" [selectedValue]="selectedRegion" label="Region"
              placeholder="Select region" [enableSearch]="true" [searchControlName]="'regionSearch'"
              [searchPlaceholder]="'Search regions...'" (selectionChange)="onRegionChangeInAdd($event)" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-input [label]="'Location'" [placeholder]="'Circle'" [control]="addBranchForm.controls.location"
            [id]="'branch-location'" [required]="true" variant="select" />
          <div>
            <app-select label="Manager" [options]="managerOptions" [selectedValue]="selectedManager"
              placeholder="Select manager" [enableSearch]="true" [searchControlName]="'managerSearch'"
              [searchPlaceholder]="'Search managers...'" (selectionChange)="onManagerChangeInAdd($event)" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-input [label]="'Phone Number'" [placeholder]="'+233 24 123 4567'"
            [control]="addBranchForm.controls.phoneNumber" [id]="'branch-phone'" variant="select" />
          <app-input [label]="'Email'" type="email" [placeholder]="'branch@pharmacy.com'"
            [control]="addBranchForm.controls.email" [id]="'branch-email'" variant="select" />
        </div>
      </form>
    </app-popup>

    <div class="mb-3">
      <p class="text-2xl font-semibold text-gray-800">Branches</p>
      <p class="text-sm font-light text-gray-600">
        Manage and view all branches in your system
      </p>
    </div>

    <div class="flex flex-col-reverse md:flex-row items-center justify-between gap-4 mb-4">
      <!-- Search Section -->
      <div class="w-full md:w-80">
        <app-input [placeholder]="'Search by name, ID, or location...'" [hasLeftIcon]="true" size="sm"
          [control]="searchControl" [id]="'branch-search'">
          <lucide-icon [img]="icons.Search" [size]="16" slot="left-icon" />
        </app-input>
      </div>
      <!-- Filter and Export Section -->
      <div class="flex flex-wrap gap-3 w-full md:justify-end justify-start flex-row items-center">
        @if (hasActiveFilters) {
        <button (click)="clearAllFilters()"
          class="flex items-center gap-2 px-3 md:px-4  md:py-2 py-3 text-sm font-light text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-200">
          <lucide-icon [img]="icons.XCircle" [size]="16" />
          <span class="hidden sm:inline">Clear Filters</span>
        </button>
        <div class="h-6 w-px bg-gray-300 hidden sm:block"></div>
        }

        <button (click)="openFilterModal()"
          class="flex items-center gap-2 px-3 md:px-4  md:py-2 py-3 text-sm font-light text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-200">
          <lucide-icon [img]="icons.SlidersHorizontal" [size]="16" />
          <span class="hidden sm:inline">Filter</span>
        </button>

        <app-export-select [actions]="exportOptions" class="md:w-32" [placeholder]="'Export'" size="sm"
          [icon]="icons.Download" (actionSelected)="onExportTypeChange($event)" />

        <button (click)="onAddBranch()"
          class="flex items-center text-sm font-light gap-2 px-3 md:px-4 md:py-2 py-3 bg-green-800 text-white rounded-xl hover:bg-green-700 transition-all duration-300 ease-out transform hover:scale-105 cursor-pointer">
          <span class="hidden sm:inline">Add New</span>
          <lucide-icon [img]="icons.Plus" [size]="16" strokeWidth="3" />
        </button>
      </div>
    </div>
  </section>

  <!-- Table Container - Full Available Width -->
  <div class="overflow-x-auto table-container-full">
    <div class="px-4 md:px-6">
      <app-data-table [columns]="tableColumns" [data]="filteredBranches" [getActionMenuItems]="getMenuItems" />
    </div>
  </div>

  <!-- Filter Modal -->
  <app-popup [isOpen]="isFilterModalOpen()" heading="Filters"
    description="Select filters to apply to the branches table" variant="right" panelWidth="w-[28rem]"
    [primaryAction]="filterModalPrimaryAction" [secondaryAction]="filterModalSecondaryAction"
    (close)="closeFilterModal()">
    <form [formGroup]="filterForm" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Region</label>
        <app-select [options]="regionOptions" [selectedValue]="selectedFilterRegion" placeholder="Select region"
          [enableSearch]="true" [searchControlName]="'regionSearch'" [searchPlaceholder]="'Search regions...'"
          (selectionChange)="onRegionFilterChange($event)" />
      </div>
    </form>
  </app-popup>

  <!-- Delete Confirmation Modal -->
  <app-confirmation-modal [isOpen]="isDeleteModalOpen()" heading="Delete Branch" [description]="deleteModalDescription"
    [primaryAction]="deleteModalPrimaryAction" [secondaryAction]="deleteModalSecondaryAction"
    (close)="closeDeleteModal()" />

  <!-- View Branch Modal -->
  <app-popup [isOpen]="isViewBranchModalOpen()" [heading]="viewingBranch ? viewingBranch.name : 'Branch Details'"
    [description]="
      isEditMode() ? 'Edit branch information' : 'View branch details'
    " variant="right" panelWidth="w-[44rem]" [primaryAction]="viewBranchModalPrimaryAction"
    [secondaryAction]="viewBranchModalSecondaryAction" (close)="closeViewBranchModal()">
    @if (viewingBranch) {
    <div class="flex flex-col gap-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-input [label]="'Branch Name'" [control]="editBranchForm.controls.name" [id]="'edit-branch-name'"
          [required]="true" [isDisabled]="!isEditMode()" />
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-700">Region</label>
          <app-select [options]="regionOptions" [selectedValue]="selectedRegion" placeholder="Select region"
            [enableSearch]="true" [searchControlName]="'regionSearch'" [searchPlaceholder]="'Search regions...'"
            [disabled]="!isEditMode()" (selectionChange)="onRegionChangeInEdit($event)" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-input [label]="'Location'" [control]="editBranchForm.controls.location" [id]="'edit-branch-location'"
          [required]="true" [isDisabled]="!isEditMode()" />
        <app-select [label]="'Manager'" [options]="managerOptions" [selectedValue]="selectedManager"
          placeholder="Select manager" [enableSearch]="true" [searchControlName]="'managerSearch'"
          [searchPlaceholder]="'Search managers...'" [disabled]="!isEditMode()"
          (selectionChange)="onManagerChangeInEdit($event)" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-input [label]="'Phone Number'" [control]="editBranchForm.controls.phoneNumber" [id]="'edit-branch-phone'"
          [isDisabled]="!isEditMode()" />
        <app-input [label]="'Email'" type="email" [control]="editBranchForm.controls.email" [id]="'edit-branch-email'"
          [isDisabled]="!isEditMode()" />
      </div>

      <div class="flex text-gray-500 italic text-sm gap-2">
        Date Created on {{ viewingBranch.dateCreated }}
      </div>
    </div>
    }
  </app-popup>
</main>
