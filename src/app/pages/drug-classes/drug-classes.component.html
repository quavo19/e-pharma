<main class="p-4 md:p-6 relative">
  <section class="flex flex-col gap-2 mx-auto">
    <!-- Heading Section -->
    <div class="mb-4 md:mb-6">
      <p class="text-xl md:text-2xl font-semibold text-gray-800">
        Drug Classes
      </p>
      <p class="text-sm font-light text-gray-600">
        Manage drug classes and categories
      </p>
    </div>

    <!-- Search and Add New Button Row -->
    <div class="flex flex-row items-center justify-between gap-4 mb-4">
      <div class="w-full md:w-80">
        <app-input [placeholder]="'Search by name or description...'" [hasLeftIcon]="true" size="sm"
          [control]="searchControl" [id]="'drug-class-search'">
          <lucide-icon [img]="icons.Search" [size]="16" slot="left-icon" />
        </app-input>
      </div>
      <button (click)="onAddDrugClass()"
        class="flex items-center text-sm font-light gap-2 px-3 md:px-4 md:py-2 py-3 bg-green-800 text-white rounded-xl hover:bg-green-700 transition-all duration-300 ease-out transform hover:scale-105 cursor-pointer">
        <span class="hidden sm:inline">Add New</span>
        <lucide-icon [img]="icons.Plus" [size]="16" strokeWidth="3" />
      </button>
    </div>

    <ng-template #nameCellTemplate let-drugClass let-index="index">
      <span class="text-sm font-medium text-gray-900">{{
        drugClass.name
        }}</span>
    </ng-template>
  </section>

  <!-- Table Container - Full Available Width -->
  <div class="overflow-x-auto table-container-full">
    <div class="px-4 md:px-6">
      <app-data-table [columns]="tableColumns()" [data]="filteredDrugClasses" [getActionMenuItems]="getMenuItems" />
    </div>
  </div>

  <app-popup [isOpen]="isAddModalOpen()" heading="Add New Drug Class" description="Create a new drug class"
    variant="right" panelWidth="w-[28rem]" [primaryAction]="addModalPrimaryAction"
    [secondaryAction]="addModalSecondaryAction" (close)="closeAddModal()">
    <form [formGroup]="drugClassForm" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <app-input label="Name" [placeholder]="'Enter drug class name'" [control]="drugClassForm.controls.name"
          [id]="'drug-class-name'" [required]="true" />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Description</label>
        <app-input [placeholder]="'Enter description (optional)'" [control]="drugClassForm.controls.description"
          [id]="'drug-class-description'" [textarea]="true" size="md" />
      </div>
    </form>
  </app-popup>

  <app-confirmation-modal [isOpen]="isDeleteModalOpen()" heading="Delete Drug Class"
    [description]="deleteModalDescription" [primaryAction]="deleteModalPrimaryAction"
    [secondaryAction]="deleteModalSecondaryAction" (close)="closeDeleteModal()" />

  <app-popup [isOpen]="isViewModalOpen()" [heading]="viewingDrugClass ? viewingDrugClass.name : 'Drug Class Details'"
    [description]="
      isEditMode() ? 'Edit drug class information' : 'View drug class details'
    " variant="right" panelWidth="w-[28rem]" [primaryAction]="viewModalPrimaryAction"
    [secondaryAction]="viewModalSecondaryAction" (close)="closeViewModal()">
    @if (viewingDrugClass) {
    <form [formGroup]="drugClassForm" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <app-input label="Name" [placeholder]="'Enter drug class name'" [control]="drugClassForm.controls.name"
          [id]="'edit-drug-class-name'" [required]="true" [isDisabled]="!isEditMode()" />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Description</label>
        <app-input [placeholder]="'Enter description (optional)'" [control]="drugClassForm.controls.description"
          [id]="'edit-drug-class-description'" [textarea]="true" size="md" [isDisabled]="!isEditMode()" />
      </div>

      <div class="flex text-gray-500 italic text-sm gap-2">
        Date Created on {{ viewingDrugClass.dateCreated }}
      </div>
    </form>
    }
  </app-popup>
</main>
