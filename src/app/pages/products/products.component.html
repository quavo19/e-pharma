<main class="p-6 relative">
  <section class="flex flex-col gap-2">
    <app-popup
      [isOpen]="isAddOpen"
      [heading]="'Add Drug'"
      [description]="'Create a new product'"
      [variant]="'right'"
      [panelWidth]="'w-[44rem]'"
      [primaryAction]="addDrugPrimaryAction"
      [secondaryAction]="addDrugSecondaryAction"
      (close)="closeAdd()"
    >
      <form
        [formGroup]="addDrugForm"
        (ngSubmit)="onSubmitAddDrug()"
        class="flex flex-col gap-4"
      >
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-input
            [label]="'Name'"
            [placeholder]="'Paracetamol'"
            [control]="addDrugForm.controls.name"
            [id]="'drug-name'"
            [required]="true"
            variant="select"
          />
          <div>
            <label class="block text-primary text-base mb-1">Shelve</label>
            <app-input
              [placeholder]="'AMA'"
              [control]="addDrugForm.controls.shelve"
              [id]="'drug-shelve'"
              variant="select"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-primary text-base mb-1">Drug Class</label>
            <app-select
              [options]="drugClassOptions"
              [selectedValue]="selectedDrugClass"
              placeholder="Select class"
              (selectionChange)="onDrugClassChange($event)"
            />
          </div>
          <div>
            <label class="block text-primary text-base mb-1">Dosage Form</label>
            <app-select
              [options]="dosageFormOptions"
              [selectedValue]="selectedDosageForm"
              placeholder="Select dosage form"
              (selectionChange)="onDosageFormChange($event)"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <app-input
            [label]="'Quantity'"
            type="number"
            [placeholder]="'56'"
            [control]="addDrugForm.controls.quantity"
            [id]="'drug-quantity'"
            variant="select"
          />
          <app-input
            [label]="'Strength'"
            type="number"
            [placeholder]="'500'"
            [control]="addDrugForm.controls.strength"
            [id]="'drug-strength'"
            variant="select"
          />
          <div>
            <label class="block text-primary text-base mb-1">Unit</label>
            <app-select
              [options]="unitOptions"
              [selectedValue]="selectedUnit"
              placeholder="Select unit"
              (selectionChange)="onUnitChange($event)"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-input
            [label]="'Created By'"
            [placeholder]="'Pharmacist K. Mensah'"
            [control]="addDrugForm.controls.createdBy"
            [id]="'drug-created-by'"
            variant="select"
          />
          <app-input
            [label]="'Expiry Date'"
            type="date"
            [control]="addDrugForm.controls.expiryDate"
            [id]="'drug-expiry'"
            variant="select"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-input
            [label]="'Brand'"
            [placeholder]="'GSK'"
            [control]="addDrugForm.controls.brand"
            [id]="'drug-brand'"
            variant="select"
          />
          <app-input
            [label]="'Stock Threshold'"
            type="number"
            [placeholder]="'6'"
            [control]="addDrugForm.controls.stockThreshold"
            [id]="'drug-stock-threshold'"
            variant="select"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <app-input
            [label]="'Cost Price'"
            type="number"
            [placeholder]="'562'"
            [control]="addDrugForm.controls.costPrice"
            [id]="'drug-cost-price'"
            variant="select"
          />
          <app-input
            [label]="'Selling Price'"
            type="number"
            [placeholder]="'67'"
            [control]="addDrugForm.controls.sellingPrice"
            [id]="'drug-selling-price'"
            variant="select"
          />
          <app-input
            [label]="'Discount Value (%)'"
            type="number"
            [placeholder]="'20'"
            [control]="addDrugForm.controls.discountValue"
            [id]="'drug-discount'"
            variant="select"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <app-input
            [label]="'Supplier Name'"
            [placeholder]="'usdi'"
            [control]="addDrugForm.controls.supplierName"
            [id]="'drug-supplier-name'"
            variant="select"
          />
          <app-input
            [label]="'Supplier Contact'"
            [placeholder]="'23359588326'"
            [control]="addDrugForm.controls.supplierContact"
            [id]="'drug-supplier-contact'"
            variant="select"
          />
        </div>
      </form>
    </app-popup>
    <div class="flex items-center justify-between mb-3">
      <div>
        <p class="text-2xl font-semibold text-gray-800">Products</p>
        <p class="text-sm font-light text-gray-600">
          Manage and view all products in your inventory
        </p>
      </div>
      <button
        (click)="onAddProduct()"
        class="flex items-center text-sm font-light gap-2 px-4 py-2 bg-green-800 text-white rounded-xl hover:bg-green-700 transition-all duration-300 ease-out transform hover:scale-105 cursor-pointer"
      >
        Add New
        <lucide-icon [img]="icons.Plus" [size]="16" strokeWidth="3" />
      </button>
    </div>

    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-4">
        <div class="w-80">
          <app-input
            [placeholder]="'Search by name, ID, or category...'"
            [hasLeftIcon]="true"
            size="sm"
            [control]="searchControl"
            [id]="'product-search'"
          >
            <lucide-icon [img]="icons.Search" [size]="16" slot="left-icon" />
          </app-input>
        </div>
      </div>
      <div class="flex items-center gap-3">
        @if (hasActiveFilters) {
        <button
          (click)="clearAllFilters()"
          class="flex items-center gap-2 px-4 py-2 text-sm font-light text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-200"
        >
          <lucide-icon [img]="icons.XCircle" [size]="16" />
          Clear Filters
        </button>
        <div class="h-6 w-px bg-gray-300"></div>
        }

        <button
          (click)="openFilterModal()"
          class="flex items-center gap-2 px-4 py-2 text-sm font-light text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-200"
        >
          <lucide-icon [img]="icons.SlidersHorizontal" [size]="16" />
          Filter
        </button>

        <app-export-select
          [actions]="exportOptions"
          class="w-32"
          [placeholder]="'Export'"
          size="sm"
          [icon]="icons.Download"
          (actionSelected)="onExportTypeChange($event)"
        />
      </div>
    </div>

    <app-data-table
      [columns]="tableColumns"
      [data]="filteredProducts"
      [getActionMenuItems]="getMenuItems"
    />
  </section>

  <!-- Filter Modal -->
  <app-popup
    [isOpen]="isFilterModalOpen()"
    heading="Filters"
    description="Select filters to apply to the products table"
    variant="right"
    panelWidth="w-[28rem]"
    [primaryAction]="filterModalPrimaryAction"
    [secondaryAction]="filterModalSecondaryAction"
    (close)="closeFilterModal()"
  >
    <form [formGroup]="filterForm" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Drug Class</label>
        <app-select
          [options]="categoryOptions"
          [selectedValue]="filterForm.get('category')?.value ?? null"
          placeholder="Select drug class"
          [enableSearch]="true"
          [searchControlName]="'categorySearch'"
          [searchPlaceholder]="'Search drug classes...'"
          (selectionChange)="onCategoryChange($event)"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700"
          >Expiry Date Sort</label
        >
        <app-select
          [options]="expiryDateSortOptions"
          [selectedValue]="filterForm.get('expiryDateSort')?.value ?? null"
          placeholder="Select sort order"
          (selectionChange)="onExpiryDateSortChange($event)"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Branch</label>
        <app-select
          [options]="branchOptions"
          [selectedValue]="filterForm.get('branch')?.value ?? null"
          placeholder="Select branch"
          [enableSearch]="true"
          [searchControlName]="'branchSearch'"
          [searchPlaceholder]="'Search branches...'"
          (selectionChange)="onBranchChange($event)"
        />
      </div>
    </form>
  </app-popup>

  <!-- Delete Confirmation Modal -->
  <app-confirmation-modal
    [isOpen]="isDeleteModalOpen()"
    heading="Delete Product"
    [description]="deleteModalDescription"
    [primaryAction]="deleteModalPrimaryAction"
    [secondaryAction]="deleteModalSecondaryAction"
    (close)="closeDeleteModal()"
  />

  <!-- View Product Modal -->
  <app-popup
    [isOpen]="isViewProductModalOpen()"
    [heading]="viewingProduct ? viewingProduct.name : 'Product Details'"
    [description]="
      isEditMode() ? 'Edit product information' : 'View product details'
    "
    variant="right"
    panelWidth="w-[44rem]"
    [primaryAction]="viewProductModalPrimaryAction"
    [secondaryAction]="viewProductModalSecondaryAction"
    (close)="closeViewProductModal()"
  >
    @if (viewingProduct) {
    <div class="flex flex-col gap-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-700">Product Name</label>
          <app-input
            [placeholder]="'Enter product name'"
            [control]="editProductForm.controls.name"
            [id]="'edit-product-name'"
            [isDisabled]="!isEditMode()"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-700">Drug Class</label>
          <app-select
            [options]="categoryOptions"
            [selectedValue]="editProductForm.get('category')?.value ?? null"
            placeholder="Select drug class"
            [disabled]="!isEditMode()"
            (selectionChange)="onCategoryChangeInEdit($event)"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-700">Shelve</label>
          <app-input
            [placeholder]="'Enter shelve'"
            [control]="editProductForm.controls.stock"
            [id]="'edit-product-shelve'"
            [isDisabled]="!isEditMode()"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-700">Quantity</label>
          <app-input
            type="number"
            [placeholder]="'Enter quantity'"
            [control]="editProductForm.controls.quantity"
            [id]="'edit-product-quantity'"
            [isDisabled]="!isEditMode()"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-700">Expiry Date</label>
          <app-input
            type="date"
            [control]="editProductForm.controls.expiryDate"
            [id]="'edit-product-expiry'"
            [isDisabled]="!isEditMode()"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-700">Inputted By</label>
          <p class="text-sm text-gray-900">{{ viewingProduct.inputtedBy }}</p>
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-700">Branch</label>
          <app-select
            [options]="branchOptions"
            [selectedValue]="editProductForm.get('branch')?.value ?? null"
            placeholder="Select branch"
            [disabled]="!isEditMode()"
            (selectionChange)="onBranchChangeInEdit($event)"
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Status</label>
        <span
          class="inline-block py-1 px-3 text-xs font-medium rounded-full border text-center w-fit"
          [class.bg-green-100]="viewingProduct.status === 'Active'"
          [class.text-green-800]="viewingProduct.status === 'Active'"
          [class.bg-red-100]="viewingProduct.status === 'Inactive'"
          [class.text-red-800]="viewingProduct.status === 'Inactive'"
          [class.border-green-500]="viewingProduct.status === 'Active'"
          [class.border-red-500]="viewingProduct.status === 'Inactive'"
        >
          {{ viewingProduct.status }}
        </span>
      </div>
    </div>
    }
  </app-popup>
</main>
