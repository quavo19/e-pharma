<main class="p-4 md:p-6 relative">
  <section class="flex flex-col gap-2 mx-auto">
    <app-popup
      [isOpen]="isAddOpen"
      [heading]="'Add Product'"
      [description]="'Create a new product'"
      [variant]="'right'"
      [panelWidth]="'w-[44rem]'"
      [primaryAction]="addDrugPrimaryAction"
      [secondaryAction]="addDrugSecondaryAction"
      (close)="closeAdd()"
    >
      <app-add-product-form
        (formSubmit)="onProductFormSubmit($event)"
        (formCancel)="closeAdd()"
      />
    </app-popup>
    <!-- Heading Section -->
    <div class="mb-4 md:mb-6">
      <p class="text-xl md:text-2xl font-semibold text-gray-800">Products</p>
      <p class="text-sm font-light text-gray-600">
        Manage and view all products in your inventory
      </p>
    </div>
    <div class="flex flex-col-reverse md:flex-row gap-4 mb-4">
      <!-- Search Section -->
      <div class="">
        <div class="w-full md:w-80">
          <app-input
            [placeholder]="'Search by name, ID, or category...'"
            [hasLeftIcon]="true"
            size="sm"
            [control]="searchControl"
            [id]="'product-search'"
          >
            <lucide-icon [img]="icons.Search" [size]="16" slot="left-icon" />
          </app-input>
        </div>
      </div>
      <div
        class="flex flex-wrap gap-3 w-full md:justify-end justify-start flex-row items-center"
      >
        @if (hasActiveFilters) {
        <button
          (click)="clearAllFilters()"
          class="flex items-center gap-2 px-3 md:px-4 py-2 text-sm font-light text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-200"
        >
          <lucide-icon [img]="icons.XCircle" [size]="16" />
          <span class="hidden sm:inline">Clear Filters</span>
        </button>
        <div class="h-6 w-px bg-gray-300 hidden sm:block"></div>
        }

        <button
          (click)="openFilterModal()"
          class="flex items-center gap-2 px-3 md:px-4 py-2 text-sm font-light text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-200"
        >
          <lucide-icon [img]="icons.SlidersHorizontal" [size]="16" />
          <span class="hidden sm:inline">Filter</span>
        </button>

        <app-export-select
          [actions]="exportOptions"
          class="md:w-32"
          [placeholder]="'Export'"
          size="sm"
          [icon]="icons.Download"
          (actionSelected)="onExportTypeChange($event)"
        />

        <button
          (click)="onAddProduct()"
          class="flex items-center text-sm border border-green-800 font-light gap-2 px-3 py-2 md:px-4 bg-green-800 text-white rounded-xl hover:bg-green-700 transition-all duration-300 ease-out transform hover:scale-105 cursor-pointer"
        >
          <span class="hidden sm:inline">Add New</span>
          <lucide-icon [img]="icons.Plus" [size]="16" strokeWidth="3" />
        </button>
      </div>
    </div>
    <!-- Action Buttons Row -->
  </section>

  <!-- Table Container - Full Available Width -->
  <div class="overflow-x-auto table-container-full">
    <div class="px-4 md:px-6">
      <app-data-table
        [columns]="tableColumns"
        [data]="filteredProducts"
        [getActionMenuItems]="getMenuItems"
      />
    </div>
  </div>

  <!-- Modals Component -->
  <app-products-modals
    [isFilterModalOpen]="isFilterModalOpen()"
    [filterForm]="filterForm"
    [categoryOptions]="categoryOptions"
    [expiryDateSortOptions]="expiryDateSortOptions"
    [branchOptions]="branchOptions"
    [isDeleteModalOpen]="isDeleteModalOpen()"
    [deleteModalDescription]="deleteModalDescription"
    [isViewProductModalOpen]="isViewProductModalOpen()"
    [viewingProduct]="viewingProduct"
    [isEditMode]="isEditMode()"
    [editProductForm]="editProductForm"
    [productNameOptions]="productNameOptions"
    [shelveOptions]="shelveOptions"
    [dosageFormOptions]="dosageFormOptions"
    [unitOptions]="unitOptions"
    [supplierOptions]="supplierOptions"
    [selectedShelve]="selectedShelve"
    [selectedDosageForm]="selectedDosageForm"
    [selectedUnit]="selectedUnit"
    [selectedSupplierName]="selectedSupplierName"
    (filterModalClose)="closeFilterModal()"
    (onCategoryChange)="onCategoryChange($event)"
    (onExpiryDateSortChange)="onExpiryDateSortChange($event)"
    (onBranchChange)="onBranchChange($event)"
    (applyFilters)="applyFilters()"
    (deleteModalClose)="closeDeleteModal()"
    (confirmDelete)="confirmDelete()"
    (viewProductModalClose)="closeViewProductModal()"
    (onProductNameChange)="onProductNameChange($event)"
    (onCategoryChangeInEdit)="onCategoryChangeInEdit($event)"
    (onShelveChangeInEdit)="onShelveChangeInEdit($event)"
    (onDosageFormChangeInEdit)="onDosageFormChangeInEdit($event)"
    (onUnitChangeInEdit)="onUnitChangeInEdit($event)"
    (onBranchChangeInEdit)="onBranchChangeInEdit($event)"
    (onSupplierNameChange)="onSupplierNameChange($event)"
    (saveProductChanges)="saveProductChanges()"
    (enterEditMode)="enterEditMode()"
    (cancelEdit)="cancelEdit()"
  />
</main>
