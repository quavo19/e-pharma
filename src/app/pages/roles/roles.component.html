<main class="p-6 relative">
  <section class="flex flex-col gap-2">
    <div class="mb-3">
      <p class="text-2xl font-semibold text-gray-800">Roles</p>
      <p class="text-sm font-light text-gray-600">
        Manage roles and their permissions
      </p>
    </div>

    <div class="flex items-center justify-between gap-4 mb-4">
      <!-- Search Section -->
      <div class="w-full md:w-80">
        <app-input [placeholder]="'Search by name or description...'" [hasLeftIcon]="true" size="sm"
          [control]="searchControl" [id]="'role-search'">
          <lucide-icon [img]="icons.Search" [size]="16" slot="left-icon" />
        </app-input>
      </div>
      <!-- Add Section -->
      <div class="flex items-center gap-3">
        <button (click)="onAddRole()"
          class="flex items-center text-sm font-light gap-2 px-3 md:px-4 md:py-2 py-3 bg-green-800 text-white rounded-xl hover:bg-green-700 transition-all duration-300 ease-out transform hover:scale-105 cursor-pointer">
          <span class="hidden sm:inline">Add New Role</span>
          <lucide-icon [img]="icons.Plus" [size]="16" strokeWidth="3" />
        </button>
      </div>
    </div>

    <ng-template #statusCellTemplate let-role let-index="index">
      <span class="inline-block py-2 text-xs font-medium rounded-full border text-center min-w-[80px]"
        [class.bg-green-100]="role.status === 'Active'" [class.text-green-800]="role.status === 'Active'"
        [class.bg-red-100]="role.status === 'Inactive'" [class.text-red-800]="role.status === 'Inactive'"
        [class.border-green-500]="role.status === 'Active'" [class.border-red-500]="role.status === 'Inactive'">
        {{ role.status }}
      </span>
    </ng-template>
  </section>

  <!-- Table Container - Full Available Width -->
  <div class="overflow-x-auto table-container-full">
    <div class="px-4 md:px-6">
      <app-data-table [columns]="tableColumns()" [data]="filteredRoles" [getActionMenuItems]="getMenuItems" />
    </div>
  </div>

  <app-popup [isOpen]="isRoleModalOpen()" [heading]="editingRole ? 'Edit Role' : 'Create New Role'" [description]="
      editingRole
        ? 'Update role details and permissions'
        : 'Create a new role with custom permissions'
    " variant="right" panelWidth="w-[40rem]" [primaryAction]="roleModalPrimaryAction"
    [secondaryAction]="roleModalSecondaryAction" (close)="closeRoleModal()">
    <form [formGroup]="roleForm" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <app-input [placeholder]="'Enter role name'" label="Role Name" [control]="roleForm.controls.name"
          [id]="'role-name'" [required]="true" />
      </div>

      <div class="flex flex-col gap-2">
        <app-input label="Role Description" [placeholder]="'Enter role description'"
          [control]="roleForm.controls.description" [id]="'role-description'" [textarea]="true" size="md" />
      </div>

      <div class="flex flex-col gap-4">
        <p class="text-sm font-medium text-gray-700">Permissions</p>
        <div class="max-h-96 overflow-y-auto">
          <div class="flex flex-wrap gap-3">
            @for (permission of permissions; track permission.id) {
            <div class="flex items-center gap-2">
              <app-custom-checkbox [control]="permissionControls.get(permission.id) || null" />
              <span class="text-sm text-gray-900">
                {{ permission.name }}
              </span>
            </div>
            }
          </div>
        </div>
      </div>
    </form>
  </app-popup>

  <app-confirmation-modal [isOpen]="isDeleteModalOpen()" heading="Delete Role" [description]="deleteModalDescription"
    [primaryAction]="deleteModalPrimaryAction" [secondaryAction]="deleteModalSecondaryAction"
    (close)="closeDeleteModal()" />

  <app-confirmation-modal [isOpen]="isStatusModalOpen()" [heading]="statusModalHeading"
    [description]="statusModalDescription" [primaryAction]="statusModalPrimaryAction"
    [secondaryAction]="statusModalSecondaryAction" (close)="closeStatusModal()" />
</main>
