<app-popup
  [isOpen]="isOpen()"
  heading="Place Order"
  description="Select a branch and confirm your order"
  variant="right"
  panelWidth="w-[32rem]"
  [primaryAction]="placeOrderModalPrimaryAction"
  [secondaryAction]="placeOrderModalSecondaryAction"
  (close)="onClose()"
>
  <form [formGroup]="placeOrderForm" class="flex flex-col gap-6">
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Branch</label>
        <app-select
          [options]="branchOptions()"
          [selectedValue]="selectedBranch"
          placeholder="Select branch"
          [enableSearch]="true"
          [searchControlName]="'branchSearch'"
          [searchPlaceholder]="'Search branches...'"
          (selectionChange)="onBranchChange($event)"
        />
      </div>

      <app-input
        [label]="'Contact Number (Optional)'"
        [placeholder]="'+233 24 123 4567'"
        [control]="placeOrderForm.controls.contactNumber"
        [id]="'place-order-contact'"
        variant="select"
      />

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Notes (Optional)</label>
        <textarea
          [formControl]="placeOrderForm.controls.notes"
          placeholder="Add any additional notes or instructions..."
          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-900 bg-white focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent resize-none"
          rows="3"
        ></textarea>
      </div>
    </div>

    <div class="border-t border-gray-200 pt-4">
      <p class="text-sm font-medium text-gray-700 mb-3">Order Summary</p>
      <div class="flex flex-col gap-2 mb-4 max-h-48 overflow-y-auto">
        @for (item of cartItems(); track item.productId) {
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-600">
            {{ item.product.name }} (x{{ item.quantity }})
          </span>
          <span class="font-medium text-gray-900">
            {{ (item.product.costPrice * item.quantity).toFixed(2) }}
          </span>
        </div>
        }
      </div>
      <div
        class="flex items-center justify-between pt-3 border-t border-gray-200"
      >
        <span class="text-base font-semibold text-gray-900">Total:</span>
        <span class="text-lg font-bold text-gray-900">
          {{ cartTotal().toFixed(2) }}
        </span>
      </div>
    </div>
  </form>
</app-popup>
