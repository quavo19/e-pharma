<main class="p-6 relative">
  <section class="flex flex-col gap-2">
    <div class="flex items-center justify-between mb-3">
      <div>
        <p class="text-2xl font-semibold text-gray-800">Suppliers</p>
        <p class="text-sm font-light text-gray-600">
          Manage your suppliers and view their stock
        </p>
      </div>
    </div>

    <div class="flex flex-col-reverse md:flex-row items-center justify-between gap-4 mb-4">
      <!-- Search Section -->
      <div class="w-full md:w-80">
        <app-input
          [placeholder]="'Search by name, country, or region...'"
          [hasLeftIcon]="true"
          size="sm"
          [control]="searchControl"
          [id]="'supplier-search'"
        >
          <lucide-icon [img]="icons.Search" [size]="16" slot="left-icon" />
        </app-input>
      </div>
      <!-- Filter and Add Section -->
      <div class="flex flex-wrap gap-3 w-full md:justify-end justify-start flex-row items-center">
        @if (hasActiveFilters) {
        <button
          (click)="clearAllFilters()"
          class="flex items-center gap-2 px-3 md:px-4 py-2 text-sm font-light text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-200"
        >
          <lucide-icon [img]="icons.XCircle" [size]="16" />
          <span class="hidden sm:inline">Clear Filters</span>
        </button>
        <div class="h-6 w-px bg-gray-300 hidden sm:block"></div>
        }

        <button
          (click)="openFilterModal()"
          class="flex items-center gap-2 px-3 md:px-4 py-2 text-sm font-light text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-200"
        >
          <lucide-icon [img]="icons.SlidersHorizontal" [size]="16" />
          <span class="hidden sm:inline">Filter</span>
        </button>
        <div class="h-6 w-px bg-gray-300 hidden sm:block"></div>

        <button
          (click)="openAddModal()"
          class="flex items-center text-sm font-light gap-2 px-3 md:px-4 py-2 bg-green-800 text-white rounded-xl hover:bg-green-700 transition-all duration-300 ease-out transform hover:scale-105 cursor-pointer"
        >
          <span class="hidden sm:inline">Add New</span>
          <lucide-icon [img]="icons.Plus" [size]="16" strokeWidth="3" />
        </button>
      </div>
    </div>
  </section>

  <!-- Table Container - Full Available Width -->
  <div class="overflow-x-auto table-container-full">
    <div class="px-4 md:px-6">
      <app-data-table
        [columns]="tableColumns()"
        [data]="getFormattedSuppliers()"
        [getActionMenuItems]="getMenuItems"
        [onRowClick]="onRowClick"
      />
    </div>
  </div>

  <!-- Filter Modal -->
  <app-popup
    [isOpen]="isFilterModalOpen()"
    heading="Filters"
    description="Select filters to apply to the suppliers"
    variant="right"
    panelWidth="w-[28rem]"
    [primaryAction]="filterModalPrimaryAction"
    [secondaryAction]="filterModalSecondaryAction"
    (close)="closeFilterModal()"
  >
    <form [formGroup]="filterForm" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Favorite</label>
        <app-select
          [options]="favoriteOptions"
          [selectedValue]="
            filterForm.get('favorite')?.value === true
              ? 'true'
              : filterForm.get('favorite')?.value === false
              ? 'false'
              : null
          "
          placeholder="All suppliers"
          (selectionChange)="onFavoriteFilterChange($event)"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Country</label>
        <app-select
          [options]="countryOptions"
          [selectedValue]="filterForm.get('country')?.value ?? null"
          placeholder="Select country"
          [enableSearch]="true"
          [searchControlName]="'countrySearch'"
          [searchPlaceholder]="'Search countries...'"
          (selectionChange)="onCountryFilterChange($event)"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-700">Region</label>
        <app-select
          [options]="regionOptions"
          [selectedValue]="filterForm.get('region')?.value ?? null"
          placeholder="Select region"
          [enableSearch]="true"
          [searchControlName]="'regionSearch'"
          [searchPlaceholder]="'Search regions...'"
          (selectionChange)="onRegionFilterChange($event)"
        />
      </div>
    </form>
  </app-popup>

  <!-- Add Supplier Modal -->
  <app-popup
    [isOpen]="isAddModalOpen()"
    heading="Add Supplier"
    description="Add a new supplier to your list"
    variant="right"
    panelWidth="w-[32rem]"
    [primaryAction]="addModalPrimaryAction"
    [secondaryAction]="addModalSecondaryAction"
    (close)="closeAddModal()"
  >
    <form [formGroup]="supplierForm" class="flex flex-col gap-4">
      <div>
        <app-input
          [label]="'Supplier Name'"
          [control]="supplierForm.controls.name"
          [id]="'supplier-name'"
          [placeholder]="'Enter supplier name'"
        />
      </div>
      <div>
        <app-select
          [label]="'Region'"
          [options]="regionOptions"
          [selectedValue]="supplierForm.get('region')?.value ?? null"
          [id]="'supplier-region'"
          [placeholder]="'Select region'"
          [enableSearch]="true"
          [searchControlName]="'regionSearch'"
          (selectionChange)="onRegionFormChange($event)"
        />
      </div>
      <div>
        <app-select
          [label]="'Country'"
          [options]="countryOptions"
          [selectedValue]="supplierForm.get('country')?.value ?? null"
          [id]="'supplier-country'"
          [placeholder]="'Select country'"
          [enableSearch]="true"
          [searchControlName]="'countrySearch'"
          (selectionChange)="onCountryFormChange($event)"
        />
      </div>
      <div>
        <app-input
          [label]="'Email'"
          [type]="'email'"
          [control]="supplierForm.controls.email"
          [id]="'supplier-email'"
          [placeholder]="'Enter email address'"
        />
      </div>
      <div>
        <app-input
          [label]="'Phone'"
          [control]="supplierForm.controls.phone"
          [id]="'supplier-phone'"
          [placeholder]="'Enter phone number'"
        />
      </div>
    </form>
  </app-popup>

  <!-- Edit Supplier Modal -->
  <app-popup
    [isOpen]="isEditModalOpen()"
    heading="Edit Supplier"
    description="Update supplier information"
    variant="right"
    panelWidth="w-[32rem]"
    [primaryAction]="editModalPrimaryAction"
    [secondaryAction]="editModalSecondaryAction"
    (close)="closeEditModal()"
  >
    <form [formGroup]="supplierForm" class="flex flex-col gap-4">
      <div>
        <app-input
          [label]="'Supplier Name'"
          [control]="supplierForm.controls.name"
          [id]="'edit-supplier-name'"
          [placeholder]="'Enter supplier name'"
        />
      </div>
      <div>
        <app-select
          [label]="'Region'"
          [options]="regionOptions"
          [selectedValue]="supplierForm.get('region')?.value ?? null"
          [id]="'edit-supplier-region'"
          [placeholder]="'Select region'"
          [enableSearch]="true"
          [searchControlName]="'regionSearch'"
          (selectionChange)="onRegionFormChange($event)"
        />
      </div>
      <div>
        <app-select
          [label]="'Country'"
          [options]="countryOptions"
          [selectedValue]="supplierForm.get('country')?.value ?? null"
          [id]="'edit-supplier-country'"
          [placeholder]="'Select country'"
          [enableSearch]="true"
          [searchControlName]="'countrySearch'"
          (selectionChange)="onCountryFormChange($event)"
        />
      </div>
      <div>
        <app-input
          [label]="'Email'"
          [type]="'email'"
          [control]="supplierForm.controls.email"
          [id]="'edit-supplier-email'"
          [placeholder]="'Enter email address'"
        />
      </div>
      <div>
        <app-input
          [label]="'Phone'"
          [control]="supplierForm.controls.phone"
          [id]="'edit-supplier-phone'"
          [placeholder]="'Enter phone number'"
        />
      </div>
    </form>
  </app-popup>

  <!-- Delete Confirmation Modal -->
  <app-confirmation-modal
    [isOpen]="isDeleteModalOpen()"
    [heading]="'Delete Supplier'"
    [description]="
      deletingSupplier
        ? 'Are you sure you want to delete ' +
          deletingSupplier.name +
          '? This action cannot be undone.'
        : ''
    "
    [primaryAction]="deleteModalPrimaryAction"
    [secondaryAction]="deleteModalSecondaryAction"
    (close)="closeDeleteModal()"
  />

  <!-- View Supplier Details Modal -->
  <app-popup
    [isOpen]="isViewModalOpen()"
    [heading]="isViewEditMode() ? 'Edit Supplier' : 'Supplier Details'"
    [description]="
      isViewEditMode()
        ? 'Update supplier information'
        : 'View supplier information'
    "
    variant="right"
    panelWidth="w-[32rem]"
    [primaryAction]="viewModalPrimaryAction"
    [secondaryAction]="viewModalSecondaryAction"
    (close)="closeViewModal()"
  >
    @if (viewingSupplier) {
    <form [formGroup]="supplierForm" class="flex flex-col gap-4">
      <div>
        <app-input
          [label]="'Supplier Name'"
          [control]="supplierForm.controls.name"
          [id]="'view-supplier-name'"
          [placeholder]="'Enter supplier name'"
          [isDisabled]="!isViewEditMode()"
        />
      </div>
      <div>
        <app-select
          [label]="'Region'"
          [options]="regionOptions"
          [selectedValue]="supplierForm.get('region')?.value ?? null"
          [id]="'view-supplier-region'"
          [placeholder]="'Select region'"
          [enableSearch]="true"
          [searchControlName]="'regionSearch'"
          [disabled]="!isViewEditMode()"
          (selectionChange)="onRegionFormChange($event)"
        />
      </div>
      <div>
        <app-select
          [label]="'Country'"
          [options]="countryOptions"
          [selectedValue]="supplierForm.get('country')?.value ?? null"
          [id]="'view-supplier-country'"
          [placeholder]="'Select country'"
          [enableSearch]="true"
          [searchControlName]="'countrySearch'"
          [disabled]="!isViewEditMode()"
          (selectionChange)="onCountryFormChange($event)"
        />
      </div>
      <div>
        <app-input
          [label]="'Email'"
          [type]="'email'"
          [control]="supplierForm.controls.email"
          [id]="'view-supplier-email'"
          [placeholder]="'Enter email address'"
          [isDisabled]="!isViewEditMode()"
        />
      </div>
      <div>
        <app-input
          [label]="'Phone'"
          [control]="supplierForm.controls.phone"
          [id]="'view-supplier-phone'"
          [placeholder]="'Enter phone number'"
          [isDisabled]="!isViewEditMode()"
        />
      </div>
    </form>
    }
  </app-popup>
</main>
